<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infection Control – Summary</title>
<style>
:root{--p:#0f766e;--pl:#e8f5f2;--pm:#b7dfd8;--t:#1f2d2b;--g:#6b7280}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--t);font-family:Segoe UI,Tahoma,Arial,sans-serif;line-height:1.55;font-size:16px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--pm);padding:10px 12px}
h1{margin:0 0 6px;font-size:18px;color:var(--p)}
.bar{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:14px}
.btn.o{background:var(--pl);color:var(--p);border:1px solid var(--pm)}
main{max-width:820px;margin:0 auto;padding:12px}
.card{border:1px solid var(--pm);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--pl);color:var(--p);font-weight:700;cursor:pointer}
.ch small{display:block;font-weight:400;font-size:13px}
.ch i{font-style:normal;transition:.2s}.open>.ch i{transform:rotate(180deg)}
.cb{display:none;padding:12px 14px}.open>.cb{display:block}
.en{font-size:16px}
.ar{font-size:13px;color:var(--g);text-align:right;direction:rtl;margin:1px 0 8px}
.hide-ar .ar{display:none}
mark{background:#fff176;padding:0 2px;border-radius:3px}
ul{padding-left:18px;margin:6px 0}
.tip{background:#f1f8f6;border-left:4px solid var(--p);padding:6px 10px;border-radius:6px;margin:6px 0;font-size:14px}
.tip .ar{display:inline}
h4{margin:10px 0 4px;color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.tc{border:1px solid var(--pm);border-radius:10px;background:#fff;overflow:hidden}
.tch{padding:9px 10px;background:var(--pl);font-weight:600;cursor:pointer;font-size:15px;color:var(--p)}
.tcb{display:none;padding:8px 10px;font-size:14px}.tc.open .tcb{display:block}
.tc.open .tch{background:var(--p);color:#fff}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th{background:var(--p);color:#fff;padding:7px;text-align:left}
td{border:1px solid var(--pm);padding:6px;vertical-align:top}
tr:nth-child(even) td{background:#f6fbfa}
.svg{width:100%;max-width:340px;display:block;margin:6px auto}
.nd circle{fill:var(--pl);stroke:var(--p);stroke-width:2;cursor:pointer}
.nd.sel circle{fill:var(--p)}.nd.sel text{fill:#fff}
.nd text{font-size:11px;text-anchor:middle;fill:var(--t);pointer-events:none;font-weight:600}
.info{background:var(--pl);border-radius:10px;padding:10px;min-height:50px;font-size:14px}
.step{background:var(--pl);border-radius:10px;padding:10px;font-size:15px}
.sn{font-size:12px;color:var(--g)}
.nav{display:flex;justify-content:space-between;margin:6px 0}
.nav button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:7px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--pl);border:1px solid var(--pm);border-radius:20px;padding:4px 12px;font-size:14px}
.q{border-bottom:1px solid var(--pm);padding:8px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--pm);border-radius:8px;padding:8px;margin:5px 0;font-size:15px}
.opt.ok{background:#d1f5e4;border-color:#16a34a}
.opt.no{background:#fde2e2;border-color:#dc2626}
.score{font-weight:700;color:var(--p);margin:10px 0;font-size:17px}
</style>
</head>
<body>
<header>
<h1>🦠 Infection Control – Quick Review</h1>
<div class="bar">
<button class="btn" id="tr" onclick="tgAr()">Hide Arabic / إخفاء العربي</button>
<button class="btn o" onclick="allc(1)">Open all</button>
<button class="btn o" onclick="allc(0)">Close all</button>
</div>
</header>
<main id="app"></main>
<script>
var $=function(i){return document.getElementById(i)};
function L(e,a){return "<div class='en'>"+e+"</div><div class='ar'>"+a+"</div>"}
function B(items){return "<ul>"+items.map(function(x){return "<li>"+L(x[0],x[1])+"</li>"}).join("")+"</ul>"}
function T(w,a){return "<div class='tip'>💡 <b>"+w+"</b> = <span class='ar'>"+a+"</span></div>"}
function H(t,a){return "<h4>"+t+" <span class='ar' style='display:inline'>"+a+"</span></h4>"}
function TB(h,rows){return "<div class='tw'><table><tr>"+h.map(function(x){return "<th>"+x+"</th>"}).join("")+"</tr>"+rows.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+c+"</td>"}).join("")+"</tr>"}).join("")+"</table></div>"}
function TC(items){return "<div class='grid'>"+items.map(function(x){return "<div class='tc'><div class='tch' onclick='tg(this)'>"+x[0]+"</div><div class='tcb'>"+x[1]+"</div></div>"}).join("")+"</div>"}
function CH(a){return "<div class='chips'>"+a.map(function(x){return "<span class='chip'>"+x+"</span>"}).join("")+"</div>"}
function tg(e){e.parentNode.classList.toggle("open")}
function allc(o){document.querySelectorAll(".card").forEach(function(c){c.classList.toggle("open",!!o)})}
function tgAr(){var h=document.body.classList.toggle("hide-ar");$("tr").textContent=h?"Show Arabic / إظهار العربي":"Hide Arabic / إخفاء العربي"}
/* ring */
var RG=[];
function RING(items,center){var id=RG.length;RG.push(items);var n=items.length,s="<svg viewBox='0 0 320 320' class='svg'><circle cx='160' cy='160' r='100' fill='none' stroke='#b7dfd8' stroke-width='3' stroke-dasharray='6 5'/><text x='160' y='156' text-anchor='middle' font-size='13' fill='#0f766e' font-weight='700'>"+center+"</text><text x='160' y='174' text-anchor='middle' font-size='18'>✂️</text>";
items.forEach(function(it,i){var a=-Math.PI/2+i*2*Math.PI/n,x=Math.round(160+105*Math.cos(a)),y=Math.round(160+105*Math.sin(a));s+="<g class='nd' onclick='rg("+id+","+i+",this)'><circle cx='"+x+"' cy='"+y+"' r='40'/><text x='"+x+"' y='"+(y-3)+"'>"+it[0]+"</text><text x='"+x+"' y='"+(y+12)+"' font-size='15'>"+it[1]+"</text></g>"});
return s+"</svg><div class='info' id='ri"+id+"'>👆 Tap a link / اضغط على حلقة</div>"}
function rg(id,i,el){el.parentNode.querySelectorAll(".nd").forEach(function(n){n.classList.remove("sel")});el.classList.add("sel");$("ri"+id).innerHTML=RG[id][i][2]}
/* stepper */
var SP=[];
function STEP(steps){var id=SP.length;SP.push({s:steps,i:0});return "<div class='step' id='sp"+id+"'></div><div class='nav'><button onclick='sp("+id+",-1)'>◀ Back</button><button onclick='sp("+id+",1)'>Next ▶</button></div>"}
function sp(id,d){var o=SP[id];o.i=Math.max(0,Math.min(o.s.length-1,o.i+d));$("sp"+id).innerHTML="<div class='sn'>Step "+(o.i+1)+" / "+o.s.length+"</div><h4>"+o.s[o.i][0]+"</h4>"+o.s[o.i][1]}
/* quiz */
var Q=[
["Asepsis is:","الأسيبسيس هو:",["Freedom from disease-causing microorganisms","Killing only spores","Invasion of the body by pathogens","Removal of soil only"],0],
["Surgical asepsis equals:","الأسيبسيس الجراحي يساوي:",["Cleaning only","Medical asepsis + sterilization","Disinfection + hand washing","Standard precautions"],1],
["Autoclave (moist heat) sterilization uses steam under pressure at:","التعقيم بالأوتوكلاف بيستخدم بخار تحت ضغط على درجة:",["80 °C","100 °C","121–123 °C","200 °C"],2],
["Disinfection eliminates pathogens on inanimate objects EXCEPT:","التطهير بيقضي على الميكروبات على الأدوات ما عدا:",["Bacteria","Viruses","Fungi","Spores"],3],
["Airborne droplet nuclei are __ and an example is __:","أنوية الرذاذ المحمولة هوائيًا حجمها __ ومثالها __:",["<5 µm – Tuberculosis","<5 µm – Herpes simplex","≥5 µm – COVID-19","≥5 µm – Measles"],0],
["Infection caused by the patient's own normal flora is:","العدوى اللي سببها الفلورا الطبيعية للمريض:",["Exogenous","Endogenous","Systemic","Chronic"],1],
["Which stage of infection is the MOST infectious?","أكتر مرحلة معدية في العدوى:",["Incubation","Convalescent","Prodromal","Full illness"],2],
["Rabies reservoir is:","مخزن عدوى السعار (Rabies):",["Camel","Soil","Water","Dog"],3],
["The minimum IC practices used for ALL patients at ALL times:","أقل ممارسات مكافحة عدوى لكل المرضى في كل الأوقات:",["Airborne precautions","Contact precautions","Standard precautions","Droplet precautions"],2],
["For airborne precautions the nurse wears:","في احتياطات الهواء الممرضة بتلبس:",["Surgical mask only","N95 or P2 mask with fit check","Gloves only","No mask"],1]];
var sc=0,done={};
function QZ(){var h="";Q.forEach(function(q,i){h+="<div class='q'><div class='en'><b>"+(i+1)+". "+q[0]+"</b></div><div class='ar'>"+q[1]+"</div>";q[2].forEach(function(o,j){h+="<button class='opt' onclick='ans("+i+","+j+",this)'>"+o+"</button>"});h+="</div>"});return h+"<div class='score' id='score'></div><button class='btn' onclick='rs()'>🔄 Restart</button>"}
function ans(i,j,el){if(done[i])return;done[i]=1;var c=Q[i][3];el.parentNode.querySelectorAll(".opt").forEach(function(b,k){b.disabled=true;if(k===c)b.classList.add("ok")});if(j===c){sc++}else{el.classList.add("no")}
var n=Object.keys(done).length;$("score").textContent="Answered "+n+"/10 — Score: "+sc+"/10"+(n===10?(sc>=8?" 🌟 Excellent! ممتاز":sc>=5?" 👍 Good, review mistakes / كويس راجع الغلط":" 📖 Review again / راجع تاني"):"")}
function rs(){sc=0;done={};$("qb").innerHTML=QZ()}
/* content */
var C=[];
C.push(["📌 Objectives & Introduction","الأهداف والمقدمة",
H("Objectives","الأهداف")+B([
["Define key terms, <mark>purposes of medical asepsis</mark>, types of microorganisms and types of infection.","تعرّف المصطلحات، وأغراض الأسيبسيس الطبي، وأنواع الميكروبات والعدوى."],
["Infection process, <mark>chain of infection</mark>, <mark>course of infection</mark>.","عملية العدوى، سلسلة العدوى، مراحل العدوى."],
["Body defenses, factors increasing susceptibility, <mark>nosocomial infection</mark>.","دفاعات الجسم، عوامل زيادة القابلية للعدوى، العدوى المكتسبة من المستشفى."],
["Standard precautions; <mark>BSIS</mark> (Body Substance Isolation System) to prevent blood-borne infection.","الاحتياطات القياسية ونظام عزل سوائل الجسم لمنع العدوى المنقولة بالدم."],
["Nursing management of a patient with infection.","التمريض لمريض العدوى."]])+
H("Introduction","مقدمة")+B([
["<mark>Hospital-acquired infections</mark> are a common problem – prevalence about <mark>9%</mark>; they increase the cost of health care.","العدوى المكتسبة من المستشفى مشكلة شائعة، نسبتها حوالي 9% وبتزوّد تكلفة الرعاية."],
["About <mark>two-thirds</mark> of developing countries spend more than <mark>50%</mark> of health budgets on hospitals.","حوالي ثلثين الدول النامية بتصرف أكتر من 50% من ميزانية الصحة على المستشفيات."],
["Effective <mark>IC (infection control)</mark> programs decrease nosocomial spread, morbidity, mortality and costs.","برامج مكافحة العدوى الفعّالة بتقلل انتشار العدوى والمرض والوفيات والتكلفة."]])+
H("Figure 1: Spread in health care","أشكال انتقال العدوى")+TC([
["🧑‍⚕️➡️🛏️ HCW → Patient",L("Health care worker to patients.","من العامل الصحي للمريض.")],
["🛏️➡️🧑‍⚕️ Patient → HCW",L("Patients to health care workers.","من المريض للعامل الصحي.")],
["🛏️↔️🛏️ Patient ↔ Patient",L("Between patients (two-way arrow).","من مريض لمريض (في الاتجاهين).")],
["🧑‍⚕️↔️🧑‍⚕️ HCW ↔ HCW",L("From one health care worker to another.","من عامل صحي لعامل صحي تاني.")]])+
T("Morbidity / Mortality","نسبة المرض / نسبة الوفاة")+T("COVID-19 & HCWs","كورونا والعاملين الصحيين: \"I stayed at work for you\" – العامل بيفضل في الشغل عشان المريض")]);

C.push(["🧼 Key terms: Asepsis, Cleaning, Disinfection, Sterilization","المصطلحات الأساسية",
TC([
["Infection",L("<mark>Invasion of the body by pathogens</mark> or microorganisms capable of producing disease.","دخول مسببات المرض أو ميكروبات قادرة تعمل مرض للجسم.")],
["Nosocomial infection",L("Infections <mark>associated with delivery of health care services in a health care facility</mark>.","عدوى مرتبطة بتقديم الخدمة الصحية داخل منشأة صحية (عدوى المستشفى).")],
["Asepsis",L("<mark>Freedom from disease-causing microorganisms</mark>. Two types: medical & surgical.","خلو المكان من الميكروبات المسببة للمرض. نوعين: طبي وجراحي.")],
["Medical asepsis (Clean technique)",L("Procedures to <mark>reduce the number</mark> of microorganisms and <mark>prevent their spread</mark>. Includes <mark>standard precautions</mark> (e.g. hand washing) and <mark>transmission-based precautions</mark>. The nurse uses it to <mark>break the infection chain</mark>.","طريقة نضيفة تقلل عدد الميكروبات وتمنع انتشارها، وتشمل الاحتياطات القياسية (زي غسل الإيدين) واحتياطات الانتقال. الممرضة بتستخدمها عشان تكسر سلسلة العدوى.")],
["Surgical asepsis (Sterile technique)",L("Procedures that <mark>eliminate</mark> microorganisms from an area. <mark>Surgical asepsis = medical asepsis + sterilization</mark>.","إجراءات بتقضي على الميكروبات من المكان. الجراحي = الطبي + التعقيم.")]])+
H("Cleaning vs Disinfection vs Sterilization","المقارنة")+TB(["","What it does","Spores?"],[
["<b>Cleaning</b>","Removes foreign material (soil & organic material) from objects; <mark>inhibits growth</mark> of microorganisms.","Not killed / مش بيقتلها"],
["<b>Disinfection</b>","Eliminates <mark>pathogenic organisms</mark> on inanimate objects.","<mark>Except spores</mark> / ما عدا الجراثيم"],
["<b>Sterilization</b>","Destroys <mark>ALL</mark> microorganisms.","<mark>Including spores & viruses</mark> / بيقتلها"]])+
T("Spores","جراثيم مقاومة (شكل ساكن للبكتيريا بيتحمل الحرارة والمطهرات)")+T("Inanimate object","جماد، أداة مش كائن حي")+
H("4 Sterilization methods","طرق التعقيم الأربعة")+TC([
["1️⃣ Moist heat (Autoclave)",L("Steam under pressure at <mark>121 to 123 °C</mark> for <mark>29 min</mark> (as on the slide).","بخار تحت ضغط على 121–123 درجة لمدة 29 دقيقة (زي السلايد).")+L("Indicator tape stripes change color <b>before → after</b> = sterilized.","شريط المؤشر بيتغير لونه بعد التعقيم.")],
["2️⃣ Gas",L("<mark>Ethylene oxide</mark> gas.","غاز إيثيلين أوكسيد.")],
["3️⃣ Boiling water",L("Water temperature rises <mark>no higher than 100 °C</mark> for <mark>15 min</mark>.","الماء المغلي مش بيعدي 100 درجة، لمدة 15 دقيقة.")],
["4️⃣ Radiation",L("Both <mark>ionizing</mark> and <mark>non-ionizing</mark> radiation; e.g. <mark>ultraviolet light</mark> is non-ionizing.","إشعاع مؤين وغير مؤين، زي الأشعة فوق البنفسجية (غير مؤين).")]])]);

C.push(["🔬 Microorganisms & Types of Infection","الميكروبات وأنواع العدوى",
H("Microorganisms causing infection","الميكروبات المسببة للعدوى")+CH(["🦠 Bacteria","🧬 Viruses","🍄 Fungi","🪱 Parasites"])+
TB(["Pair","Definition"],[
["<mark>Local</mark> vs <mark>Systemic</mark>","Local = limited to the specific part where the microorganism remains. If microorganisms spread and damage different parts of the body = <mark>systemic</mark>.<div class='ar'>موضعية: في مكان واحد. جهازية: انتشرت في الجسم.</div>"],
["<mark>Acute</mark> vs <mark>Chronic</mark>","Acute = appears suddenly / lasts a short time. Chronic = occurs slowly over a long period, may last <mark>months or years</mark>.<div class='ar'>حادة: فجأة ومدتها قصيرة. مزمنة: بطيئة وممكن تستمر شهور أو سنين.</div>"],
["<mark>Endogenous</mark>","Caused by organisms present as part of the <mark>normal flora of the patient</mark>.<div class='ar'>من ميكروبات المريض الطبيعية في جسمه.</div>"],
["<mark>Exogenous</mark>","Caused by organisms acquired by exposure to <mark>hospital personnel, medical devices or hospital environment</mark>.<div class='ar'>من ميكروبات جاية من العاملين أو الأجهزة أو بيئة المستشفى.</div>"]])+
T("Normal flora","البكتيريا الطبيعية اللي عايشة في جسمك")]);

C.push(["⛓️ Chain of Infection","سلسلة العدوى",
L("Infection needs <mark>6 links</mark>. <mark>Break any link</mark> and the infection stops.","العدوى محتاجة 6 حلقات، لو كسرت أي حلقة العدوى بتقف.")+
RING([
["Agent","🦠",L("<b>Infectious agent</b>: bacteria, virus, fungi, protozoa, parasite.","العامل المعدي: بكتيريا، فيروس، فطريات، أوليات، طفيليات.")],
["Reservoir","🏠",L("<b>Reservoir</b>: people, equipment, water.","المخزن: ناس، معدات، مياه.")],
["Exit","🚪",L("<b>Portal of exit</b>: excretions, secretions, droplets.","مخرج الميكروب: إفرازات، فضلات، رذاذ.")],
["Transmit","🔀",L("<b>Mode of transmission</b>: contact, droplet, airborne, vector-borne.","طريقة الانتقال: تلامس، رذاذ، هواء، ناقل حي.")],
["Entry","🚧",L("<b>Portal of entry</b>: respiratory tract, GI tract, mucous membrane, skin.","مدخل الميكروب: تنفسي، هضمي، أغشية مخاطية، جلد.")],
["Host","🧍",L("<b>Susceptible host</b>: people with chronic disease, immunocompromised, very young, elderly.","العائل القابل للإصابة: أمراض مزمنة، مناعة ضعيفة، أطفال صغيرين، كبار السن.")]],"Break the chain")+
H("Details of each link","تفاصيل الحلقات")+TC([
["Reservoir",L("The <mark>habitat where the agent normally lives, grows and multiplies</mark>.","المكان اللي الميكروب بيعيش فيه ويتكاثر.")+B([
["<mark>Human</mark>: syphilis, TB, HIV, HBV – may be <mark>symptomatic</mark> or <mark>carrier</mark>.","الإنسان (مريض أو حامل للعدوى)."],
["<mark>Animals</mark>: Rabies – dog; MERS – camels.","حيوانات: السعار من الكلب، ميرس من الجمال."],
["<mark>Food</mark>: Cl. botulinum.","أكل."],
["<mark>Environment</mark>: soil (gas gangrene, tetanus), water.","البيئة: التربة (غرغرينا غازية، تيتانوس) والمياه."]])],
["Coronaviruses (figure)",L("<mark>Bats</mark> → SARS-CoV (animal), MERS-CoV (<mark>camel</mark>), COVID-19 (source unknown ?) → human → <mark>community</mark> or <mark>nosocomial</mark> transmission.","الخفافيش ← سارس / ميرس (جمل) / كوفيد-19 (المصدر مش معروف) ← الإنسان ← انتقال مجتمعي أو داخل المستشفى.")],
["Portal of exit",L("The path by which a pathogen leaves its host.","الطريق اللي الميكروب بيخرج منه.")+B([
["Influenza & <i>M. tuberculosis</i> → respiratory tract.","إنفلونزا والسل ← الجهاز التنفسي."],
["Schistosomes → urine.","البلهارسيا ← البول."],
["Hepatitis B → cuts or needles in the skin; malaria → blood-sucking arthropods.","التهاب كبدي B ← جروح أو إبر؛ الملاريا ← حشرات ماصة للدم."]])],
["Hepatitis B chain (Fig. 2)",L("Reservoir: chronic <mark>HBV carrier</mark> → Exit: <mark>blood</mark> → Transmission: used needles or surgical instruments → Entry: cut by <mark>sharps</mark> → Host: <mark>unvaccinated</mark> health care worker.","المخزن: حامل مزمن ← الخروج: الدم ← الانتقال: إبر أو أدوات جراحة مستعملة ← الدخول: جرح بأداة حادة ← العائل: عامل صحي غير مطعّم.")]])]);

C.push(["🚦 Modes of Transmission","طرق انتقال العدوى",
TB(["Mode","How","Examples"],[
["🤝 <b>Contact</b><br>Direct","Direct body contact<div class='ar'>تلامس مباشر</div>","Staphylococcus, <mark>Herpes simplex</mark> (HSV-1: kissing / premasticated food)"],
["🤝 <b>Contact</b><br>Indirect","Via contaminated intermediate object or person<div class='ar'>عن طريق شيء أو شخص ملوث</div>","<mark>Measles virus, HBV</mark>"],
["💦 <b>Droplet</b>","Respiratory droplets travel directly to susceptible <mark>mucosal surfaces</mark>, over <mark>short distances</mark>; from cough, sneeze, talk, suctioning, intubation, cough induction<div class='ar'>رذاذ تنفسي لمسافات قصيرة</div>","<mark>COVID-19</mark>"],
