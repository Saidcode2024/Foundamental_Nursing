<script>
// If anything fails, show the reason instead of a stuck "Loading..."
window.addEventListener('error', function (e) {
  var v = document.getElementById('view');
  if (v && /Loading/.test(v.textContent)) v.innerHTML = '<div class="err"><b>Error:</b> ' + e.message + '<br>' + (e.filename || '') + '</div>';
});
</script>
